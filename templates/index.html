<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web App Vulnerability Scanner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <h1>Web App Vulnerability Scanner</h1>

<form action="{{ url_for('start_scan') }}" method="post">
      <label>
        Target URL:
        <input type="text" name="target" placeholder="https://example.com" required>
      </label>

      <fieldset>
        <legend>Checks</legend>
        <label><input type="checkbox" name="checks" value="SQLi" checked> SQL Injection (SQLi)</label>
        <label><input type="checkbox" name="checks" value="XSS" checked> Cross-Site Scripting (XSS)</label>
      </fieldset>

      <button type="submit">Start Scan</button>
    </form>

    <p style="margin-top:1rem;color:#c00;">
      <strong>Warning:</strong> Only scan targets you own or have explicit permission to test.
    </p>
</body>
</html>
